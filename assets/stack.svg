<svg
  width="1000"
  height="560"
  viewBox="0 0 1000 560"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- Main gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4DA6"/>
      <stop offset="50%" stop-color="#A374FF"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>

    <!-- Core gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4DA6"/>
      <stop offset="50%" stop-color="#A374FF"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Small glow -->
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- ===================================================== -->
  <!-- BACKGROUND -->
  <!-- ===================================================== -->

  <rect
    x="0"
    y="0"
    width="1000"
    height="560"
    rx="16"
    fill="#0D1117"
    stroke="#2A2B45"
    stroke-width="1.5"
  />


  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <text
    x="40"
    y="38"
    font-family="'Courier New', monospace"
    font-size="15"
    font-weight="700"
    fill="#E0C3FC"
  >
    Tech Orbit
  </text>

  <text
    x="40"
    y="57"
    font-family="'Courier New', monospace"
    font-size="10"
    fill="#7C7C9C"
  >
    Tools in active rotation
  </text>


  <!-- small status -->
  <g transform="translate(842,30)">

    <circle
      cx="7"
      cy="7"
      r="4"
      fill="#4DD0E1"
      filter="url(#smallGlow)"
    >
      <animate
        attributeName="opacity"
        values="1;0.3;1"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="17"
      y="11"
      font-family="'Courier New', monospace"
      font-size="9"
      fill="#7C7C9C"
