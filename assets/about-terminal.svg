<svg width="700" height="430" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- terminal window -->
  <rect x="0" y="0" width="700" height="430" rx="12" fill="#0D1117" stroke="#2a2b45" stroke-width="1.5"/>

  <!-- window dots -->
  <circle cx="20" cy="20" r="5" fill="#FF4DA6"/>
  <circle cx="38" cy="20" r="5" fill="#A374FF"/>
  <circle cx="56" cy="20" r="5" fill="#4DD0E1"/>
  <text x="350" y="24" font-family="'Courier New', monospace" font-size="12" fill="#7c7c9c" text-anchor="middle">mona@dev: ~/about-me</text>
  <line x1="0" y1="34" x2="700" y2="34" stroke="#2a2b45" stroke-width="1"/>

  <g font-family="'Courier New', monospace" font-size="13.5">
    <text x="24" y="60"><tspan fill="#4DD0E1">$ </tspan><tspan fill="#e0c3fc">whoami</tspan></text>
    <text x="24" y="82" fill="#FF4DA6">mona-haniyeh — Full-Stack Developer &amp; UI/UX Designer</text>

    <text x="24" y="116"><tspan fill="#4DD0E1">$ </tspan><tspan fill="#e0c3fc">cat about.md</tspan></text>
    <text x="24" y="138" fill="#b8b8d0">Building user-centered web apps with Laravel, React &amp; MySQL.</text>
    <text x="24" y="158" fill="#b8b8d0">Solid engineering fundamentals + a design-first mindset.</text>
    <text x="24" y="178" fill="#b8b8d0">Focused on maintainable code and interfaces people enjoy.</text>
    <text x="24" y="198" fill="#b8b8d0">Using AI tools to move faster without cutting corners.</text>

    <text x="24" y="232"><tspan fill="#4DD0E1">$ </tspan><tspan fill="#e0c3fc">cat facts.json</tspan></text>
    <text x="24" y="254" fill="#e0c3fc">{</text>
    <text x="44" y="276"><tspan fill="#A374FF">"background"</tspan><tspan fill="#e0c3fc">: </tspan><tspan fill="#FF4DA6">"B.Sc. Software Engineering"</tspan><tspan fill="#e0c3fc">,</tspan></text>
    <text x="44" y="298"><tspan fill="#A374FF">"specialty"</tspan><tspan fill="#e0c3fc">: </tspan><tspan fill="#FF4DA6">"Laravel Full-Stack"</tspan><tspan fill="#e0c3fc">,</tspan></text>
    <text x="44" y="320"><tspan fill="#A374FF">"alsoDoes"</tspan><tspan fill="#e0c3fc">: </tspan><tspan fill="#FF4DA6">"UI/UX Design"</tspan><tspan fill="#e0c3fc">,</tspan></text>
    <text x="44" y="342"><tspan fill="#A374FF">"basedIn"</tspan><tspan fill="#e0c3fc">: </tspan><tspan fill="#FF4DA6">"Amman, Jordan"</tspan></text>
    <text x="24" y="364" fill="#e0c3fc">}</text>

    <text x="24" y="398">
      <tspan fill="#4DD0E1">$ </tspan><tspan fill="#e0c3fc">_</tspan>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.85;0.9;1" dur="1.2s" repeatCount="indefinite" />
    </text>
  </g>
</svg>
