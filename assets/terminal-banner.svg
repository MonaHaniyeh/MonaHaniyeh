<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="asciiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4DA6"/>
      <stop offset="50%" stop-color="#A374FF"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="700" height="230" rx="12" fill="#0D1117" stroke="#2a2b45" stroke-width="1.5"/>

  <!-- window dots -->
  <circle cx="20" cy="20" r="5" fill="#FF4DA6"/>
  <circle cx="38" cy="20" r="5" fill="#A374FF"/>
  <circle cx="56" cy="20" r="5" fill="#4DD0E1"/>
  <text x="350" y="24" font-family="'Courier New', monospace" font-size="12" fill="#7c7c9c" text-anchor="middle">mona-haniyeh — terminal</text>
  <line x1="0" y1="34" x2="700" y2="34" stroke="#2a2b45" stroke-width="1"/>

  <!-- ASCII block art: HELLO WORLD -->
  <text x="24" y="60" font-family="'Courier New', monospace" font-size="10" fill="url(#asciiGrad)" xml:space="preserve">
    <tspan x="24" dy="0">_|    _|  _|_|_|_|  _|        _|          _|_|        _|          _|    _|_|    _|_|_|    _|        _|_|_|    </tspan>
    <tspan x="24" dy="12">_|    _|  _|        _|        _|        _|    _|      _|          _|  _|    _|  _|    _|  _|        _|    _|  </tspan>
    <tspan x="24" dy="12">_|_|_|_|  _|_|_|    _|        _|        _|    _|      _|    _|    _|  _|    _|  _|_|_|    _|        _|    _|  </tspan>
    <tspan x="24" dy="12">_|    _|  _|        _|        _|        _|    _|        _|  _|  _|    _|    _|  _|    _|  _|        _|    _|  </tspan>
    <tspan x="24" dy="12">_|    _|  _|_|_|_|  _|_|_|_|  _|_|_|_|    _|_|            _|  _|        _|_|    _|    _|  _|_|_|_|  _|_|_|    </tspan>
  </text>

  <!-- status line -->
  <text x="24" y="146" font-family="'Courier New', monospace" font-size="15" fill="#4DD0E1">
    &gt; system online — welcome_
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.85;0.9;1" dur="1.2s" repeatCount="indefinite" />
  </text>

  <line x1="24" y1="162" x2="676" y2="162" stroke="#2a2b45" stroke-width="1"/>

  <!-- typing cycle line (merged from typing.svg, now inside the same frame) -->
  <g font-family="'Courier New', monospace" font-size="17" font-weight="600">
    <text x="24" y="192" fill="#FF4DA6" opacity="0">
      Design it. Code it. Build it. 💜
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1" dur="9s" repeatCount="indefinite" />
    </text>
    <text x="24" y="192" fill="#FF4DA6" opacity="0">
      Turning ideas into real products
      <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1" dur="9s" repeatCount="indefinite" />
    </text>
    <text x="24" y="192" fill="#FF4DA6" opacity="0">
      Laravel | React | UI/UX Designer
      <animate attributeName="opacity" values="0;0;0;0;0;0;0;1;0" keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1" dur="9s" repeatCount="indefinite" />
    </text>
  </g>

  <rect x="0" y="214" width="700" height="16" fill="#12131f"/>
  <text x="24" y="226" font-family="'Courier New', monospace" font-size="10" fill="#7c7c9c">Full-Stack Developer • UI/UX Designer • Amman, Jordan</text>
</svg>
