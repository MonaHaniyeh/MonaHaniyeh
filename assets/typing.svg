<svg width="600" height="50" viewBox="0 0 600 50" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .typed {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      font-weight: 600;
      fill: #FF4DA6;
    }
  </style>

  <text x="0" y="32" class="typed" opacity="0">
    Design it. Code it. Build it. 💜
    <animate attributeName="opacity"
      values="0;1;1;0;0;0;0;0;0"
      keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
      dur="9s" repeatCount="indefinite" />
  </text>

  <text x="0" y="32" class="typed" opacity="0">
    Turning ideas into real products
    <animate attributeName="opacity"
      values="0;0;0;0;1;1;0;0;0"
      keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
      dur="9s" repeatCount="indefinite" />
  </text>

  <text x="0" y="32" class="typed" opacity="0">
    Laravel | React | UI/UX Designer
    <animate attributeName="opacity"
      values="0;0;0;0;0;0;0;1;0"
      keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
      dur="9s" repeatCount="indefinite" />
  </text>

  <rect x="0" y="12" width="3" height="22" fill="#FF4DA6">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
    <animate attributeName="x" values="0;340;0" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite" />
  </rect>
</svg>
