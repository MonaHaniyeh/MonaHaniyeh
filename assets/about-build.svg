<svg width="1000" height="360" viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1000" height="360" rx="14" fill="#0D1117" stroke="#2a2b45" stroke-width="1.5"/>

  <!-- ============ LEFT: browser-window capability card ============ -->
  <g transform="translate(24,24)">
    <rect x="0" y="0" width="462" height="312" rx="12" fill="#12131f" stroke="#2a2b45" stroke-width="1.5"/>
    <rect x="0" y="0" width="462" height="30" rx="12" fill="#1a1b2e"/>
    <rect x="0" y="18" width="462" height="12" fill="#1a1b2e"/>
    <circle cx="16" cy="15" r="4" fill="#FF4DA6"/>
    <circle cx="30" cy="15" r="4" fill="#A374FF"/>
    <circle cx="44" cy="15" r="4" fill="#4DD0E1"/>
    <rect x="64" y="7" width="300" height="16" rx="8" fill="#0D1117"/>
    <text x="74" y="19" font-family="'Courier New',monospace" font-size="9" fill="#7c7c9c">github.com/MonaHaniyeh</text>
    <rect x="370" y="7" width="1" height="16" fill="#4DD0E1">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <text x="20" y="56" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#e0c3fc">What I Build</text>

    <g font-family="'Courier New',monospace" font-size="10.5" fill="#b8b8d0">
      <rect x="20" y="70" width="26" height="26" rx="6" fill="#1a1b2e" stroke="#FF4DA6"/>
      <text x="33" y="88" text-anchor="middle" fill="#FF4DA6" font-size="12">🖥️</text>
      <text x="56" y="82" fill="#e0c3fc" font-weight="700">Back-End &amp; Architecture</text>
      <text x="56" y="98">Laravel apps, REST APIs, role-based auth, scalable DB design</text>

      <rect x="20" y="118" width="26" height="26" rx="6" fill="#1a1b2e" stroke="#A374FF"/>
      <text x="33" y="136" text-anchor="middle" fill="#A374FF" font-size="12">🎨</text>
      <text x="56" y="130" fill="#e0c3fc" font-weight="700">Front-End &amp; Experience</text>
      <text x="56" y="146">Responsive interfaces, React components, micro-interactions</text>

      <rect x="20" y="166" width="26" height="26" rx="6" fill="#1a1b2e" stroke="#4DD0E1"/>
      <text x="33" y="184" text-anchor="middle" fill="#4DD0E1" font-size="12">🤖</text>
      <text x="56" y="178" fill="#e0c3fc" font-weight="700">AI-Powered Features</text>
      <text x="56" y="194">AI tools woven into every product I ship</text>
    </g>

    <text x="20" y="230" font-family="'Courier New',monospace" font-size="10" fill="#7c7c9c">$ php artisan serve</text>
    <text x="20" y="248" font-family="'Courier New',monospace" font-size="10" fill="#4DD0E1">  Server running on http://127.0.0.1:8000</text>
    <text x="20" y="266" font-family="'Courier New',monospace" font-size="10" fill="#7c7c9c">$ <tspan fill="#e0c3fc">_</tspan>
      <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.85;0.9;1" dur="1.2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ============ RIGHT: focus-areas carousel ============ -->
  <g transform="translate(512,24)">
    <rect x="0" y="0" width="464" height="312" rx="12" fill="#12131f" stroke="#2a2b45" stroke-width="1.5"/>
    <text x="20" y="32" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#e0c3fc">Focus Areas</text>

    <!-- segment progress bars (3 segments cycling every 4s) -->
    <g transform="translate(20,48)">
      <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#2a2b45"/>
      <rect x="0" y="0" width="0" height="3" rx="1.5" fill="#FF4DA6">
        <animate attributeName="width" values="0;140;140;140" keyTimes="0;0.33;0.99;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="148" y="0" width="140" height="3" rx="1.5" fill="#2a2b45"/>
      <rect x="148" y="0" width="0" height="3" rx="1.5" fill="#A374FF">
        <animate attributeName="width" values="0;0;140;140" keyTimes="0;0.33;0.66;1" dur="12s" repeatCount="indefinite"/>
      </rect>
      <rect x="296" y="0" width="140" height="3" rx="1.5" fill="#2a2b45"/>
      <rect x="296" y="0" width="0" height="3" rx="1.5" fill="#4DD0E1">
        <animate attributeName="width" values="0;0;0;140" keyTimes="0;0.33;0.66;0.99" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- slide 1 -->
    <g font-family="'Courier New',monospace">
      <text x="20" y="100" font-size="40" opacity="0">🧱
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.30;0.33" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="90" font-size="16" font-weight="700" fill="#FF4DA6" opacity="0">Full-Stack Laravel
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.30;0.33" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="110" font-size="10" fill="#b8b8d0" opacity="0">Capstone "LawFirm" — 98/100, Gold Tier
        <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.30;0.33" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- slide 2 -->
    <g font-family="'Courier New',monospace">
      <text x="20" y="100" font-size="40" opacity="0">⚛️
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.34;0.63;0.66" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="90" font-size="16" font-weight="700" fill="#A374FF" opacity="0">Learning React.js
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.34;0.63;0.66" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="110" font-size="10" fill="#b8b8d0" opacity="0">From zero, aiming toward senior-level
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.34;0.63;0.66" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- slide 3 -->
    <g font-family="'Courier New',monospace">
      <text x="20" y="100" font-size="40" opacity="0">🎨
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="90" font-size="16" font-weight="700" fill="#4DD0E1" opacity="0">UI/UX Design
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/>
      </text>
      <text x="80" y="110" font-size="10" fill="#b8b8d0" opacity="0">Trained at The Hope International Company
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.63;0.67;1" dur="12s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- daily rings -->
    <text x="20" y="180" font-family="'Courier New',monospace" font-size="10" fill="#7c7c9c">Today's rhythm</text>
    <g transform="translate(40,220)">
      <circle r="24" fill="none" stroke="#1a1b2e" stroke-width="6"/>
      <circle r="24" fill="none" stroke="#FF4DA6" stroke-width="6" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="151;38" dur="1.6s" begin="0.3s" fill="freeze"/>
      </circle>
      <text y="4" font-family="'Courier New',monospace" font-size="9" fill="#e0c3fc" text-anchor="middle">Code</text>
    </g>
    <g transform="translate(120,220)">
      <circle r="24" fill="none" stroke="#1a1b2e" stroke-width="6"/>
      <circle r="24" fill="none" stroke="#A374FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="151;60" dur="1.6s" begin="0.5s" fill="freeze"/>
      </circle>
      <text y="4" font-family="'Courier New',monospace" font-size="9" fill="#e0c3fc" text-anchor="middle">Design</text>
    </g>
    <g transform="translate(200,220)">
      <circle r="24" fill="none" stroke="#1a1b2e" stroke-width="6"/>
      <circle r="24" fill="none" stroke="#4DD0E1" stroke-width="6" stroke-linecap="round" stroke-dasharray="151" stroke-dashoffset="151" transform="rotate(-90)">
        <animate attributeName="stroke-dashoffset" values="151;90" dur="1.6s" begin="0.7s" fill="freeze"/>
      </circle>
      <text y="4" font-family="'Courier New',monospace" font-size="9" fill="#e0c3fc" text-anchor="middle">Learn</text>
    </g>

    <text x="20" y="280" font-family="'Courier New',monospace" font-size="9" fill="#555870">Illustrative daily focus split, not live-tracked</text>
  </g>
</svg>
