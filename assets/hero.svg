<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4DA6"/>
      <stop offset="50%" stop-color="#A374FF"/>
      <stop offset="100%" stop-color="#4DD0E1"/>
    </linearGradient>

    <!-- Name reveal mask -->
    <clipPath id="revealMask">
      <rect x="0" y="-60" width="0" height="80">
        <animate
          attributeName="width"
          values="0;460"
          dur="1.4s"
          begin="0.3s"
          fill="freeze"
          calcMode="spline"
          keySplines="0.2 0 0.2 1"
        />
      </rect>
    </clipPath>

  </defs>


  <!-- Background -->
  <rect
    x="0"
    y="0"
    width="1000"
    height="280"
    rx="14"
    fill="#0D1117"
    stroke="#2a2b45"
    stroke-width="1.5"
  />


  <!-- OPEN TO COLLABS PILL -->
  <g transform="translate(40,36)">

    <rect
      x="0"
      y="0"
      width="172"
      height="28"
      rx="14"
      fill="#12131f"
      stroke="#4DD0E1"
      stroke-width="1"
    />

    <!-- Status dot -->
    <circle
      cx="16"
      cy="14"
      r="4"
      fill="#4DD0E1"
    >
      <animate
        attributeName="opacity"
        values="1;0.3;1"
        dur="1.6s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="30"
      y="18"
      font-family="'Courier New', monospace"
      font-size="10"
      fill="#4DD0E1"
    >
      OPEN TO COLLABS
    </text>

  </g>


  <!-- Greeting -->
  <text
    x="40"
    y="100"
    font-family="'Courier New', monospace"
    font-size="15"
    fill="#7c7c9c"
  >
    Hi there, I'm
  </text>


  <!-- ANIMATED NAME -->
  <g
    transform="translate(40,160)"
    clip-path="url(#revealMask)"
  >

    <text
      x="0"
      y="0"
      font-family="'Courier New', monospace"
      font-size="52"
      font-weight="700"
      fill="url(#nameGrad)"
    >
      Mona Haniyeh
    </text>

  </g>


  <!-- CYCLING ROLES -->

  <!-- Role 1 -->
  <g
    font-family="'Courier New', monospace"
    font-size="18"
    font-weight="600"
  >

    <text
      x="40"
      y="196"
      fill="#e0c3fc"
      opacity="0"
    >
      Full-Stack Laravel Developer

      <animate
        attributeName="opacity"
        values="0;1;1;0;0;0;0;0;0"
        keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
        dur="9s"
        begin="1.8s"
        repeatCount="indefinite"
      />

    </text>


    <!-- Role 2 -->
    <text
      x="40"
      y="196"
      fill="#e0c3fc"
      opacity="0"
    >
      Learning React.js → Senior Level

      <animate
        attributeName="opacity"
        values="0;0;0;0;1;1;0;0;0"
        keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
        dur="9s"
        begin="1.8s"
        repeatCount="indefinite"
      />

    </text>


    <!-- Role 3 -->
    <text
      x="40"
      y="196"
      fill="#e0c3fc"
      opacity="0"
    >
      UI/UX Designer

      <animate
        attributeName="opacity"
        values="0;0;0;0;0;0;0;1;0"
        keyTimes="0;0.03;0.30;0.33;0.36;0.63;0.66;0.96;1"
        dur="9s"
        begin="1.8s"
        repeatCount="indefinite"
      />

    </text>

  </g>


  <!-- DESCRIPTION -->
  <text
    x="40"
    y="224"
    font-family="'Courier New', monospace"
    font-size="12"
    fill="#b8b8d0"
  >
    Building user-centered web apps with Laravel, React &amp; MySQL — design-first, code-solid.
  </text>


  <!-- META ROW -->
  <g
    font-family="'Courier New', monospace"
    font-size="11"
    fill="#7c7c9c"
  >

    <text x="40" y="256">
      📍 Amman, Jordan
    </text>

    <text x="210" y="256">
      🎓 B.Sc. Software Engineering
    </text>

    <text x="440" y="256">
      🏆 98/100 · Gold Tier Capstone
    </text>

  </g>


  <!-- DECORATIVE CORNER BRACKETS -->

  <g
    stroke="#4DD0E1"
    stroke-width="2"
    fill="none"
  >

    <!-- Top right -->
    <path
      d="M 960 20 L 976 20 L 976 36"
      opacity="0"
    >
      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.6s"
        begin="0.2s"
        fill="freeze"
      />
    </path>


    <!-- Bottom left -->
    <path
      d="M 24 260 L 24 244 L 40 244"
      opacity="0"
    >
      <animate
        attributeName="opacity"
        values="0;1"
        dur="0.6s"
        begin="0.2s"
        fill="freeze"
      />
    </path>

  </g>

</svg>
